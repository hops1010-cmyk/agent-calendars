<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Agent Calendars</title><style>body{font-family:Arial;background:#111;color:#eee;padding:20px}h1{color:#7df;text-align:center}.cal{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{background:#1c1c1c;border:1px solid #333;padding:10px;min-height:60px;border-radius:6px}.day b{color:#ff9}</style></head><body><h1>Agent Calendars</h1><div class="cal" id="cal"></div><script>const c=document.getElementById('cal');for(let i=1;i<=31;i++){const d=document.createElement('div');d.className='day';d.innerHTML='<b>'+i+'</b><br><small>agent task</small>';c.appendChild(d);}</script></body></html>
